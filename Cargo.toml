[package]
name = "monitor"
description = "Live CPU, memory and per-app usage plus a disk map for macOS and Linux, in one tiny binary"
license = "MIT"
version = "1.1.1"
edition = "2021"

[dependencies]
libc = "0.2"
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
