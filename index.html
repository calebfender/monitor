<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0d0c0b">
<title>Monitor</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
@font-face { font-family: "Host Grotesk"; src: url(/fonts/host-grotesk.woff2) format("woff2"); font-weight: 300 800; font-display: swap; }
@font-face { font-family: "Geist Mono"; src: url(/fonts/geist-mono.woff2) format("woff2"); font-weight: 100 900; font-display: swap; }
:root {
  --bg-0: #0d0c0b; --bg-1: #131210; --bg-2: #1a1916; --bg-3: #23211e; --bg-inset: #090908;
  --ink-1: #ede9e2; --ink-2: #b1aba1; --ink-3: #948e84; --ink-4: #5c5850;
  --line-1: #24221f; --line-2: #33302c; --line-3: #4a4640;
  --accent: #e65f2b; --ok: #8fb59a; --warn: #d8ad4e; --danger: #ef5a5f;
  --m-a: #ede9e2; --m-b: #948e84; --m-c: #5c5850;
  --c-media: #b8875e; --c-dev: #8c87b0; --c-apps: #6f8fa6; --c-browser: #6f9e95; --c-ai: #b07a8c; --c-cache: #8a9a6a; --c-sys: #5c5850;
  --sans: "Host Grotesk", "Helvetica Neue", system-ui, sans-serif; --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --ease: cubic-bezier(0.2, 0.9, 0.1, 1);
}
* { box-sizing: border-box; margin: 0; }
html, body { background: var(--bg-0); color: var(--ink-1); }
body { font: 15px/1.45 var(--sans); letter-spacing: -0.005em; -webkit-font-smoothing: antialiased; min-height: 100vh; }
button { font: inherit; color: inherit; }
[hidden] { display: none !important; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.lab { font: 500 11px/1 var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3); }
.wrap { max-width: 1440px; margin: 0 auto; padding: 0 40px 56px; }
.in { animation: in .6s var(--ease) both; } @keyframes in { from { opacity: 0; transform: translateY(8px); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* header */
header { display: flex; align-items: center; height: 72px; gap: 32px; border-bottom: 1px solid var(--line-1); }
.brand { display: flex; align-items: center; gap: 11px; font-weight: 600; letter-spacing: -0.02em; font-size: 16px; flex: none; }
.brand img { width: 26px; height: 26px; border-radius: 6px; }
.machines { display: flex; gap: 4px; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.machines button { all: unset; cursor: pointer; display: flex; align-items: center; gap: 9px; padding: 8px 14px; border-radius: 4px; color: var(--ink-3); white-space: nowrap; transition: color .18s, background .18s; }
.machines button:hover { color: var(--ink-2); background: var(--bg-1); }
.machines button.on { color: var(--ink-1); background: var(--bg-2); }
.machines i { width: 6px; height: 6px; border-radius: 50%; background: var(--st, var(--ink-4)); flex: none; transition: background .4s; }
.machines small { font: 11.5px var(--mono); color: var(--ink-4); }
nav.views { margin-left: auto; display: flex; gap: 26px; flex: none; }
nav.views button { all: unset; cursor: pointer; color: var(--ink-3); padding: 25px 0 23px; border-bottom: 2px solid transparent; transition: color .18s, border-color .18s; }
nav.views button:hover { color: var(--ink-2); }
nav.views button.on { color: var(--ink-1); border-color: var(--accent); }

/* live */
.hero { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: end; gap: 24px; padding: 52px 0 38px; }
.hero h1 { font-size: 61px; font-weight: 600; letter-spacing: -0.045em; line-height: .92; display: flex; align-items: center; }
.hero p { color: var(--ink-2); margin-top: 16px; font-size: 17px; min-height: 25px; }
.hero .side { text-align: right; color: var(--ink-3); font: 12px/1.75 var(--mono); }
.dot { display: inline-block; flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--st, var(--ink-4)); margin-right: 20px; transition: background .4s; }
.dot.pulse { animation: pulse 2.4s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--st) 45%, transparent); } 60% { box-shadow: 0 0 0 8px color-mix(in srgb, var(--st) 0%, transparent); } }

.metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid var(--ink-1); }
.metric { padding: 20px 24px 26px 0; min-width: 0; }
.metric + .metric { padding-left: 24px; border-left: 1px solid var(--line-1); }
.metric .v { font: 400 44px/1 var(--mono); letter-spacing: -0.05em; margin: 18px 0 16px; white-space: nowrap; }
.metric .v small { font-size: 14px; color: var(--ink-3); letter-spacing: 0; margin-left: 8px; }
.metric .v.word { font: 400 30px/1 var(--sans); letter-spacing: -0.03em; margin: 25px 0 23px; }
.bar { height: 3px; background: var(--line-1); display: flex; gap: 2px; }
.bar i { display: block; height: 100%; width: 0; transition: width .8s var(--ease); }

main.live { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 56px; margin-top: 44px; border-top: 1px solid var(--line-1); padding-top: 28px; }
.ch { margin-bottom: 30px; position: relative; }
.ch .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 12px; }
.ch svg { width: 100%; height: 200px; display: block; overflow: visible; }
.ch .grid { stroke: var(--line-1); } .ch .ax { fill: var(--ink-3); font: 10.5px var(--mono); } .ch .xh { stroke: var(--ink-3); }
.key { display: flex; gap: 16px; font-size: 12.5px; color: var(--ink-3); flex-wrap: wrap; justify-content: flex-end; }
.key span { display: flex; align-items: center; gap: 7px; } .key i { width: 8px; height: 8px; border-radius: 1px; }
.seg { display: flex; gap: 2px; } .seg button { all: unset; cursor: pointer; font: 11.5px var(--mono); color: var(--ink-3); padding: 5px 10px; border-radius: 3px; transition: background .15s, color .15s; }
.seg button:hover { color: var(--ink-1); } .seg button.on { background: var(--bg-2); color: var(--ink-1); }
.draw polyline { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.4s var(--ease) forwards; } @keyframes draw { to { stroke-dashoffset: 0; } }
.disks { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 0 32px; margin-top: 12px; }
.dk { padding: 14px 0; border-top: 1px solid var(--line-1); min-width: 0; }
.dk div:first-child { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 9px; font-size: 14px; } .dk .mono { color: var(--ink-3); font-size: 12px; white-space: nowrap; }
aside.apps section + section { margin-top: 36px; }
aside.apps h3 { margin-bottom: 14px; }
.app { display: grid; grid-template-columns: minmax(0, 1fr) auto; padding: 11px 0 10px; border-top: 1px solid var(--line-1); font-size: 14px; }
.app > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.app small { color: var(--ink-4); font: 11px var(--mono); margin-left: 7px; }
.app .mono { color: var(--ink-2); font-size: 13px; }
.app .b { grid-column: 1 / -1; height: 1px; margin-top: 9px; background: var(--line-1); }
.app .b i { display: block; height: 1px; transition: width .8s var(--ease); }
.empty { color: var(--ink-4); padding: 11px 0; border-top: 1px solid var(--line-1); font-size: 14px; }

/* specs */
.specs { display: grid; grid-template-columns: 170px repeat(var(--n), minmax(0, 1fr)); margin-top: 48px; border-top: 1px solid var(--ink-1); }
.specs > div { padding: 15px 20px 15px 0; border-bottom: 1px solid var(--line-1); font-size: 14.5px; min-width: 0; }
.specs .k { font: 500 11px/1.9 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
.specs .h { font-size: 25px; font-weight: 600; letter-spacing: -0.035em; padding: 22px 20px 20px 0; display: flex; align-items: center; }
.specs .h .dot { width: 8px; height: 8px; margin-right: 14px; }
.specs small { color: var(--ink-3); font: 12px var(--mono); margin-left: 8px; }
.specs .dk { padding: 0; border: 0; } .specs .dk + .dk { margin-top: 12px; } .specs .dk .bar { margin-top: 7px; }

/* disk */
.dstats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid var(--ink-1); border-bottom: 1px solid var(--line-1); margin-top: 48px; }
.dstats > div { padding: 20px 24px 22px 0; min-width: 0; } .dstats > div + div { padding-left: 24px; border-left: 1px solid var(--line-1); }
.dstats .lab { display: flex; align-items: center; gap: 8px; }
.dstats .v { font: 400 40px/1 var(--mono); letter-spacing: -0.05em; margin: 18px 0 14px; white-space: nowrap; }
.dstats .v small { font-size: 12.5px; letter-spacing: 0; color: var(--ink-3); margin-left: 9px; } .dstats .v small.up { color: var(--ok); }
.sd { width: 7px; height: 7px; border-radius: 50%; } .sd.safe { background: var(--ok); } .sd.review { background: var(--warn); }
.bar.free { gap: 0; } #b-free { background: var(--ink-1); } #b-gain { background: var(--ok); }
main.disk { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 44px; margin-top: 28px; }
.dhead { display: flex; justify-content: space-between; align-items: center; height: 32px; margin-bottom: 12px; gap: 12px; }
.crumbs { display: flex; gap: 8px; align-items: center; font-size: 13.5px; color: var(--ink-3); white-space: nowrap; overflow: hidden; min-width: 0; }
.crumbs button { all: unset; cursor: pointer; color: var(--ink-3); } .crumbs button:hover { color: var(--ink-1); }
.crumbs b { color: var(--ink-1); font-weight: 500; } .crumbs em { font: normal 12px var(--mono); color: var(--ink-4); margin-left: 8px; }
#map { position: relative; height: calc(100vh - 400px); min-height: 440px; }
.t { position: absolute; overflow: hidden; cursor: pointer; border-radius: 3px; transition: left .45s cubic-bezier(.2,.8,.2,1), top .45s cubic-bezier(.2,.8,.2,1), width .45s cubic-bezier(.2,.8,.2,1), height .45s cubic-bezier(.2,.8,.2,1), filter .2s, opacity .3s; }
.t.l1 { border: 1px solid color-mix(in srgb, var(--c) 40%, transparent); background: color-mix(in srgb, var(--c) 10%, var(--bg-0)); }
.t.l1:hover { border-color: color-mix(in srgb, var(--c) 75%, transparent); }
.t.l2 { border: 1px solid color-mix(in srgb, var(--c) 28%, transparent); background: color-mix(in srgb, var(--c) 20%, var(--bg-0)); }
.t.l2:hover { background: color-mix(in srgb, var(--c) 32%, var(--bg-0)); }
.t.other { opacity: .6; }
.t.h-safe, .t.h-review { --h: var(--ok); border-color: color-mix(in srgb, var(--h) 70%, transparent) !important;
  background-image: repeating-linear-gradient(-45deg, color-mix(in srgb, var(--h) 24%, transparent) 0 2px, transparent 2px 8px) !important; background-color: color-mix(in srgb, var(--h) 8%, var(--bg-0)) !important; }
.t.h-review { --h: var(--warn); }
.t.sel { box-shadow: inset 0 0 0 1.5px var(--h); }
#map.clean .t:not(.h-safe):not(.h-review):not(.has) { filter: saturate(0) brightness(.5); }
.tl { position: absolute; left: 9px; top: 7px; right: 9px; display: flex; justify-content: space-between; gap: 8px; font-size: 12px; white-space: nowrap; pointer-events: none; }
.tl span:first-child { overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
.tn { font: 11px var(--mono); color: var(--ink-3); flex: none; }
.big { position: absolute; left: 9px; bottom: 7px; font-family: var(--mono); letter-spacing: -0.04em; pointer-events: none; }
.legend { display: flex; flex-wrap: wrap; gap: 18px; margin-top: 14px; font-size: 12px; color: var(--ink-3); }
.legend span { display: flex; align-items: center; gap: 7px; } .legend i { width: 8px; height: 8px; border-radius: 2px; }
.recs h3 { height: 32px; display: flex; align-items: center; margin-bottom: 12px; }
.grp { display: flex; justify-content: space-between; font: 500 11px var(--mono); letter-spacing: .12em; text-transform: uppercase; margin: 6px 0; }
.grp.safe { color: var(--ok); } .grp.review { color: var(--warn); margin-top: 24px; } .grp span:last-child { color: var(--ink-3); letter-spacing: 0; }
.rec { border-top: 1px solid var(--line-1); }
.row { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto 12px; gap: 12px; align-items: center; padding: 11px 0; cursor: pointer; }
.row:hover .t1 { color: #fff; }
.cb { width: 15px; height: 15px; border: 1.5px solid var(--ink-4); border-radius: 3px; display: grid; place-items: center; color: var(--bg-0); transition: background .15s, border-color .15s; }
.cb svg { opacity: 0; transition: opacity .15s; } .rec.on .cb { background: var(--ink-1); border-color: var(--ink-1); } .rec.on .cb svg { opacity: 1; }
.t1 { font-size: 14px; transition: color .15s; } .t2 { font: 11.5px var(--mono); color: var(--ink-4); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .tn { font-size: 12.5px; color: var(--ink-2); }
.chev { color: var(--ink-4); transition: transform .25s var(--ease); } .rec.open .chev { transform: rotate(90deg); }
.more { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .3s var(--ease); } .rec.open .more { grid-template-rows: 1fr; }
.more > div { overflow: hidden; padding-left: 30px; } .more p { font-size: 12.5px; color: var(--ink-3); padding-bottom: 8px; }
.more ul { list-style: none; padding: 0 0 8px; font-size: 12px; color: var(--ink-3); } .more li { display: flex; justify-content: space-between; padding: 2px 0; }
.more pre { font: 11px/1.5 var(--mono); color: var(--ink-2); background: var(--bg-inset); border: 1px solid var(--line-1); border-radius: 3px; padding: 8px 10px; margin-bottom: 12px; white-space: pre-wrap; word-break: break-all; }
.foot { border-top: 1px solid var(--line-1); margin-top: 18px; padding-top: 16px; font-size: 13px; color: var(--ink-3); }
.foot b { color: var(--ink-1); font: 500 13px var(--mono); }
.btns { display: flex; gap: 8px; margin: 12px 0 10px; flex-wrap: wrap; }
.btn { all: unset; cursor: pointer; padding: 8px 14px; font-size: 13px; border: 1px solid var(--line-2); border-radius: 3px; color: var(--ink-1); transition: background .15s, transform .1s; }
.btn:hover { background: var(--bg-2); } .btn:active { transform: scale(.97); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--bg-0); font-weight: 500; } .btn.pri:hover { background: #f06c38; }
.hint { font-size: 11.5px; color: var(--ink-4); }
.nodisk { margin-top: 64px; max-width: 520px; color: var(--ink-2); } .nodisk h2 { font-size: 31px; letter-spacing: -0.035em; font-weight: 600; color: var(--ink-1); margin-bottom: 12px; }
.nodisk pre { font: 12.5px var(--mono); background: var(--bg-inset); border: 1px solid var(--line-1); border-radius: 3px; padding: 12px 14px; margin-top: 16px; color: var(--ink-1); white-space: pre-wrap; }

#tip { position: fixed; pointer-events: none; z-index: 10; background: var(--bg-2); border: 1px solid var(--line-2); border-radius: 3px; padding: 8px 10px; font-size: 12px; max-width: 360px; opacity: 0; transition: opacity .12s; }
#tip .p { font: 11px var(--mono); color: var(--ink-4); word-break: break-all; margin-top: 2px; }
#tip .tr { display: flex; justify-content: space-between; gap: 18px; } #tip .tr span:last-child { font-family: var(--mono); }
#tip .tk { display: inline-block; width: 7px; height: 7px; border-radius: 1px; margin-right: 7px; }
#toast { position: fixed; bottom: 24px; left: 50%; transform: translate(-50%, 16px); background: var(--ink-1); color: var(--bg-0); padding: 9px 16px; border-radius: 3px; font-size: 13px; opacity: 0; transition: all .3s var(--ease); z-index: 11; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 1100px) {
  .wrap { padding: 0 18px 40px; }
  header { height: auto; flex-wrap: wrap; gap: 6px 18px; padding: 14px 0 0; }
  .machines { order: 3; width: 100%; padding-bottom: 10px; } nav.views button { padding: 6px 0 8px; }
  .hero { grid-template-columns: 1fr; padding: 32px 0 26px; } .hero h1 { font-size: 40px; } .hero .side { text-align: left; }
  .metrics, .dstats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .metric:nth-child(3), .dstats > div:nth-child(3) { border-left: 0; padding-left: 0; }
  .metric:nth-child(n+3), .dstats > div:nth-child(n+3) { border-top: 1px solid var(--line-1); }
  .metric .v, .dstats .v { font-size: 30px; } .metric .v small, .dstats .v small { display: block; margin: 6px 0 0; }
  main.live, main.disk { grid-template-columns: minmax(0, 1fr); gap: 32px; }
  #map { height: 62vh; min-height: 360px; }
  .specs { grid-template-columns: 96px repeat(var(--n), minmax(0, 1fr)); } .specs .h { font-size: 18px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><img src="/apple-touch-icon.png" alt="">Monitor</div>
    <nav class="machines" id="machines"></nav>
    <nav class="views" id="views"><button data-v="live" class="on">Live</button><button data-v="specs">Specs</button><button data-v="disk" id="t-disk" hidden>Disk</button></nav>
  </header>

  <div id="v-live">
    <section class="hero">
      <div><h1><span class="dot pulse" id="vdot"></span><span id="vt">Connecting…</span></h1><p id="vs"></p></div>
      <div class="side" id="vside"></div>
    </section>
    <section class="metrics">
      <div class="metric"><div class="lab">CPU</div><div class="v" id="l-cpu">–</div><div class="bar"><i id="lb-cpu" style="background:var(--accent)"></i></div></div>
      <div class="metric"><div class="lab">Memory</div><div class="v" id="l-mem">–</div><div class="bar"><i id="lb-a" style="background:var(--m-a)"></i><i id="lb-b" style="background:var(--m-b)"></i><i id="lb-c" style="background:var(--m-c)"></i></div></div>
      <div class="metric"><div class="lab">Swap</div><div class="v" id="l-swap">–</div><div class="bar"><i id="lb-swap" style="background:var(--ink-3)"></i></div></div>
      <div class="metric"><div class="lab">Pressure</div><div class="v word" id="l-pr">–</div><div class="bar"><i id="lb-pr"></i></div></div>
    </section>
    <main class="live">
      <section>
        <div class="ch" id="c-cpu"><div class="top"><span class="lab">CPU</span><div class="seg" id="range"><button data-r="300000">5M</button><button data-r="1800000" class="on">30M</button><button data-r="day">24H</button></div></div><svg></svg></div>
        <div class="ch" id="c-mem"><div class="top"><span class="lab">Memory</span><span class="key" id="ckey"></span></div><svg></svg></div>
        <div class="lab" style="margin-top:6px">Storage</div>
        <div class="disks" id="l-disks"></div>
      </section>
      <aside class="apps">
        <section><h3 class="lab">Using CPU</h3><div id="p-cpu"></div></section>
        <section><h3 class="lab">Using memory</h3><div id="p-mem"></div></section>
      </aside>
    </main>
  </div>

  <div id="v-specs" hidden><div class="specs" id="specs"></div></div>

  <div id="v-disk" hidden>
    <div id="d-none" class="nodisk" hidden></div>
    <div id="d-main">
      <section class="dstats">
        <div><div class="lab">Free after cleanup</div><div class="v" id="s-free"></div><div class="bar free"><i id="b-free"></i><i id="b-gain"></i></div></div>
        <div><div class="lab"><span class="sd safe"></span>Safe to remove</div><div class="v" id="s-safe"></div></div>
        <div><div class="lab"><span class="sd review"></span>Review first</div><div class="v" id="s-review"></div></div>
        <div><div class="lab">Disk</div><div class="v" id="s-disk"></div></div>
      </section>
      <main class="disk">
        <section>
          <div class="dhead"><div class="crumbs" id="crumbs"></div><div class="seg" id="dmode"><button data-m="category" class="on">Category</button><button data-m="cleanup">Cleanup</button></div></div>
          <div id="map"></div>
          <div class="legend" id="legend"></div>
        </section>
        <aside class="recs">
          <h3 class="lab">Recommendations</h3>
          <div id="recs"></div>
          <div class="foot">
            <div id="selsum"></div>
            <div class="btns"><button class="btn" id="selsafe">Select safe</button><button class="btn pri" id="copy">Copy script</button><button class="btn" id="dl">Download</button></div>
            <div class="hint" id="runhint"></div>
          </div>
        </aside>
      </main>
    </div>
  </div>
</div>
<div id="tip"></div><div id="toast"></div>

<script>
const $ = (s) => document.querySelector(s);
const GiB = 2 ** 30, MiB = 2 ** 20;
const gib = (b) => (b / GiB).toFixed(b >= 10 * GiB ? 0 : 1);
const gb = (b) => b >= GiB ? gib(b) + " GB" : Math.round(b / MiB) + " MB";
const pct = (v) => (v < 10 ? v.toFixed(1) : Math.round(v)) + "%";
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const clock = (t, sec) => new Date(t).toLocaleTimeString([], { hour: "numeric", minute: "2-digit", second: sec ? "2-digit" : undefined });

// ---------------------------------------------------------------- state

function verdict(x) {
  const n = x.now;
  if (x.ok === false || !n) return ["", x.ok === false ? "Can't reach it" : "Connecting…", x.ok === false ? "Its monitor isn't answering. The machine may be asleep or offline." : ""];
  const m = n.mem, recent = x.pts.filter((p) => p.t > n.t - 30000);
  const cpu30 = recent.reduce((a, p) => a + p.cpu, 0) / Math.max(1, recent.length);
  const tm = n.topMem[0] || { name: "", mem: 0 }, tc = n.topCpu[0] || { name: "", cpu: 0 };
  if (m.pressure === "critical") return ["critical", "Memory is full", `${tm.name} is using ${gb(tm.mem)}. Quitting it would help.`];
  if (m.pressure === "warn" || m.swap > 0.4 * m.total) return ["serious", "Memory is tight", `${tm.name} is using ${gb(tm.mem)}, and ${gb(m.swap)} has spilled onto the disk.`];
  if (cpu30 > 85) return ["serious", "CPU is maxed out", `${tc.name} is using ${pct(tc.cpu)} of the processor.`];
  if (cpu30 > 60) return ["warning", "Working hard", `${tc.name} is the busiest at ${pct(tc.cpu)}.`];
  return ["good", "Running smoothly", tc.cpu > 5 ? `Busiest right now: ${tc.name}` : ""];
}

// ---------------------------------------------------------------- live

}

}

function series() {

}
const endT = () => range === "day" ? Date.now() : cur().now ? cur().now.t : Date.now();

const PAD_R = 40, PAD_B = 20;

function chart(el, pts, t0, t1, ymax, lay, yfmt, ticks, animate) {

      const back = r.map((p, i) => `${X(p.t).toFixed(1)},${Y(base[i]).toFixed(1)}`).reverse();

  if (hoverT) { const hx = X(hoverT); if (hx >= 0 && hx <= iw) out.push(`<line class="xh" x1="${hx}" x2="${hx}" y1="0" y2="${ih}"/>`); }

}
function drawCharts(animate) {

  chart($("#c-mem"), pts, t0, t1, tot, [{ key: (p) => p.a, fill: "var(--m-a)", op: 0.85 }, { key: (p) => p.b, fill: "var(--m-b)", op: 0.8 }, { key: (p) => p.c, fill: "var(--m-c)", op: 0.9 }],
    (v) => Math.round(v / GiB) + "G", [tot / 2, tot], false);
}
function drawLive() {

const tip = $("#tip");
function placeTip(e) { tip.style.opacity = 1; tip.style.left = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 10) + "px"; tip.style.top = Math.min(e.clientY + 14, innerHeight - tip.offsetHeight - 10) + "px"; }
function hover(e) {
  const svg = e.currentTarget.querySelector("svg"), r = svg.getBoundingClientRect(), iw = r.width - PAD_R;
  const { pts, span } = series(), t1 = endT(), t0 = t1 - span, x = e.clientX - r.left;
  if (x < 0 || x > iw || !pts.length) return unhover();
  const t = t0 + (x / iw) * span;
  let best = pts[0]; for (const p of pts) if (Math.abs(p.t - t) < Math.abs(best.t - t)) best = p;
  if (Math.abs(best.t - t) > gapOf()) return unhover();
  hoverT = best.t; drawCharts(false);
  const k = (c) => `<i class="tk" style="background:${c}"></i>`, L = layers();
  tip.innerHTML = `<div class="p" style="margin:0 0 6px">${clock(best.t, range !== "day")}</div>`
    + `<div class="tr"><span>${k("var(--accent)")}CPU</span><span>${pct(best.cpu)}</span></div>`
    + `<div class="tr"><span>${k("var(--m-a)")}${esc(L[0])}</span><span>${gb(best.a)}</span></div>`
    + `<div class="tr"><span>${k("var(--m-b)")}${esc(L[1])}</span><span>${gb(best.b)}</span></div>`
    + `<div class="tr"><span>${k("var(--m-c)")}${esc(L[2])}</span><span>${gb(best.c)}</span></div>`

  placeTip(e);
}
function unhover() { if (hoverT !== null) { hoverT = null; drawCharts(false); } tip.style.opacity = 0; }
document.querySelectorAll(".ch").forEach((c) => { c.addEventListener("mousemove", hover); c.addEventListener("mouseleave", unhover); });

  }
  const el = $("#specs"); el.style.setProperty("--n", cols.length); el.innerHTML = h.join("");
}

// ---------------------------------------------------------------- polling
async function get(d, path) {
  const r = await fetch(devOf(d).url + path, { cache: "no-store" });
  if (!r.ok) throw new Error(r.status);
  return r.json();
}
async function poll(id) {
  const x = S[id];
  if (!document.hidden) try {
    const since = x.pts.length ? x.pts[x.pts.length - 1].t : 0;
    const d = await get(id, "/api/live?since=" + since);
    if (d.now) x.now = d.now;
    x.pts.push(...d.points.map(conv).filter((p) => p.t > since)); x.ok = true;
    const cut = (x.now?.t || Date.now()) - 1800000 - 10000; while (x.pts.length && x.pts[0].t < cut) x.pts.shift();
  } catch { x.ok = false; }
  if (id === dev || view === "specs") drawLive(); else drawMachines();
  setTimeout(() => poll(id), id === dev ? 2000 : 5000);
}
async function pollInfo(id) {
  try { S[id].info = await get(id, "/api/info"); if (id === dev) $("#t-disk").hidden = !S[id].info.diskMap; if (id === dev && view === "live") drawNow(); else if (view === "specs") drawSpecs(); } catch {}
}
async function pollDay() { const id = dev; try { S[id].day = (await get(id, "/api/day")).points.map(conv); if (range === "day" && id === dev && view === "live") drawCharts(false); } catch {} }
setInterval(() => { if (range === "day") pollDay(); }, 60000);
addEventListener("resize", () => { if (view === "live") drawCharts(false); else if (view === "disk" && D) { clearTimeout(rt); rt = setTimeout(drawMap, 80); } });

// ---------------------------------------------------------------- disk
const CATS = { media: "Documents & media", dev: "Code & dev tools", apps: "Apps", browser: "Browsers", ai: "AI models", cache: "Caches & temp", sys: "System & other" };
const RULES = [
  [/OptGuideOnDevice|superwhisper\/models|\.ollama|\.lmstudio|huggingface|\/models$/i, "ai"],
  [/\/Caches|\/\.cache|\/var\/cache|\/var\/log|\/\.npm|Temp files|\/var\/folders|\/Logs|CacheClip|\.Trash/i, "cache"],
  [/Google\/Chrome|Firefox|BraveSoftware|Safari|GoogleUpdater|Vivaldi/i, "browser"],
  [/Pictures|Movies|Music|Documents|Desktop|Downloads|Messages|Photos|DaVinci Resolve Media|Google Drive|MobileSMS/i, "media"],
  [/\/\.[^/]+|Developer|\/go$|\/go\/|vendor|Homebrew|\/opt\/homebrew|\/Code$|Xcode/i, "dev"],
  [/Applications|Application Support|Containers|Group Containers/i, "apps"],

const catOf = (n) => { if (n.system) return "sys"; for (const [re, c] of RULES) if (re.test(n.path)) return c; return /^\/(System|Library|usr|var|boot|etc|snap|lib)/.test(n.path) ? "sys" : "apps"; };
let D = null, diskFor = null, path = [], mode = "category", rt;
const sel = new Set();
const selKey = () => "mon.sel." + diskFor;
const sumOf = (a) => a.reduce((s, r) => s + r.size, 0);

function squarify(items, x, y, w, h) {
  const out = [], total = items.reduce((s, i) => s + i.size, 0);

      if (worst > best) break; best = worst; row = r;

}
const recFor = (p) => D.recs.find((r) => r.match.some((m) => p === m || p.startsWith(m + "/"))) || null;
const hasRecInside = (p) => D.recs.some((r) => r.match.some((m) => m.startsWith(p + "/")));

          + (sw > 70 && sh > 24 ? `<div class="tl"><span>${esc(s.n.name)}</span></div>` : "") + (sw > 70 && sh > 54 ? `<div class="big" style="font-size:${fs}px">${gb(s.n.size)}</div>` : "") + `</div>`);

  $("#crumbs").innerHTML = parts.join("") + `<em>${gb(cn.size)}</em>`;
}
function findPath(p) {
  const walk = (n, acc) => { for (let i = 0; i < (n.children || []).length; i++) { const c = n.children[i]; if (c.path === p) return acc.concat(i); if (p.startsWith(c.path + "/")) { const r = walk(c, acc.concat(i)); if (r) return r; } } return null; };
  return walk(D.tree, []);
}
$("#map").addEventListener("click", (e) => {
  const sub = e.target.closest("[data-sub]"), top = e.target.closest("[data-i]");
  let t = sub ? findPath(decodeURIComponent(sub.dataset.sub)) : top ? path.concat(+top.dataset.i) : null; if (!t) return;
  let n = t.reduce((a, i) => a.children[i], D.tree);
  if (!n.children && sub) { t = t.slice(0, -1); n = null; }
  if (n && !n.children) return;
  path = t; drawMap();
});
$("#crumbs").onclick = (e) => { const b = e.target.closest("button"); if (b) { path = path.slice(0, +b.dataset.d); drawMap(); } };
document.addEventListener("keydown", (e) => { if (view === "disk" && (e.key === "Escape" || e.key === "Backspace") && path.length && !e.target.closest("input,textarea")) { path.pop(); drawMap(); } });
$("#map").addEventListener("mousemove", (e) => {
  const el = e.target.closest("[data-sub]") || e.target.closest("[data-p]"); if (!el) { tip.style.opacity = 0; return; }
  const p = decodeURIComponent(el.dataset.sub || el.dataset.p), fp = findPath(p), n = fp ? fp.reduce((a, i) => a.children[i], D.tree) : { name: p, size: 0 }, r = recFor(p);
  tip.innerHTML = `<div><b>${esc(n.name)}</b> <span class="tn">${gb(n.size)}</span></div><div class="p">${esc(D.home ? p.replace(D.home, "~") : p)}</div>`
    + (r ? `<div style="color:${r.group === "safe" ? "var(--ok)" : "var(--warn)"};margin-top:4px">${r.group === "safe" ? "Safe to remove" : "Review first"} · ${esc(r.title)}</div>` : "");
  placeTip(e);
});
$("#map").addEventListener("mouseleave", () => (tip.style.opacity = 0));
$("#dmode").onclick = (e) => { const b = e.target.closest("button"); if (!b) return; document.querySelectorAll("#dmode button").forEach((x) => x.classList.toggle("on", x === b)); mode = b.dataset.m; drawMap(); };

const check = `<svg width="9" height="9" viewBox="0 0 10 10"><path d="M1.5 5.2 4 7.6 8.6 2.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const chev = `<svg class="chev" width="12" height="12" viewBox="0 0 12 12"><path d="M4.5 2.5 8 6l-3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>`;
function drawRecs() {
  const g = (k) => D.recs.filter((r) => r.group === k);
  const block = (k, label) => !g(k).length ? "" : `<div class="grp ${k}"><span>${label}</span><span>${gb(sumOf(g(k)))}</span></div>` + g(k).map((r) => `<div class="rec${sel.has(r.id) ? " on" : ""}" data-id="${esc(r.id)}">
    <div class="row"><span class="cb">${check}</span><div style="min-width:0"><div class="t1">${esc(r.title)}</div><div class="t2">${esc(r.sub)}</div></div><span class="tn">${gb(r.size)}</span>${chev}</div>
    <div class="more"><div><p>${esc(r.note)}</p>${r.breakdown?.length ? `<ul>${r.breakdown.map((b) => `<li><span>${esc(b.name)}</span><span class="tn">${gb(b.size)}</span></li>`).join("")}</ul>` : ""}<pre>${esc(r.cmd)}</pre></div></div></div>`).join("");
  $("#recs").innerHTML = block("safe", "Safe to remove") + block("review", "Review first") || `<div class="empty">Nothing to clean up. Nice.</div>`;
  updateStats();
}
$("#recs").onclick = (e) => {
  const rec = e.target.closest(".rec"); if (!rec) return; const id = rec.dataset.id;
  if (e.target.closest(".cb")) { sel.has(id) ? sel.delete(id) : sel.add(id); rec.classList.toggle("on"); saveSel(); updateStats(); drawMap(); }
  else if (e.target.closest(".row")) { rec.classList.toggle("open"); const r = D.recs.find((x) => x.id === id), fp = r.match.length ? findPath(r.match[0]) : null; if (fp && rec.classList.contains("open")) { path = fp.slice(0, -1); drawMap(); } }
};
function saveSel() { localStorage.setItem(selKey(), JSON.stringify([...sel])); }
function updateStats() {
  const s = D.recs.filter((r) => sel.has(r.id)), gain = sumOf(s), tot = D.disk.total;
  const safe = D.recs.filter((r) => r.group === "safe"), rev = D.recs.filter((r) => r.group === "review");
  $("#s-free").innerHTML = `${gb(D.disk.free + gain)}<small class="${gain ? "up" : ""}">${gain ? "+" + gb(gain) : "free now"}</small>`;
  $("#s-safe").innerHTML = `${gb(sumOf(safe))}<small>${safe.length} item${safe.length === 1 ? "" : "s"}</small>`;
  $("#s-review").innerHTML = `${gb(sumOf(rev))}<small>${rev.length} item${rev.length === 1 ? "" : "s"}</small>`;
  $("#s-disk").innerHTML = `${gb(D.disk.used)}<small>of ${gb(tot)}</small>`;
  $("#b-free").style.width = (D.disk.free / tot) * 100 + "%"; $("#b-gain").style.width = (gain / tot) * 100 + "%";
  $("#selsum").innerHTML = s.length ? `<b>${gb(gain)}</b> selected · ${s.length} item${s.length > 1 ? "s" : ""}` : "Nothing selected";
}
function script() {
  const s = D.recs.filter((r) => sel.has(r.id)), mac = D.os === "mac";
  return `#!/bin/${mac ? "zsh" : "bash"}\n# Monitor disk cleanup for ${devOf(dev).name} · ${new Date().toLocaleString()}\n# Frees about ${gb(sumOf(s))}\n\n`
    + s.map((r) => `# ${r.title} (${gb(r.size)})\n${r.cmd}\n`).join("\n") + `\necho "Done."; df -h ${mac ? "/System/Volumes/Data" : "/"} | tail -1\n`;
}
$("#selsafe").onclick = () => { sel.clear(); D.recs.filter((r) => r.group === "safe").forEach((r) => sel.add(r.id)); saveSel(); drawRecs(); drawMap(); };
$("#copy").onclick = async () => {
  if (!sel.size) return toast("Select something first");
  try { await navigator.clipboard.writeText(script()); }
  catch { const t = document.createElement("textarea"); t.value = script(); document.body.append(t); t.select(); document.execCommand("copy"); t.remove(); }
  toast("Script copied");
};
$("#dl").onclick = () => {
  if (!sel.size) return toast("Select something first");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([script()], { type: "text/x-shellscript" })); a.download = "disk-cleanup.sh"; a.click();
};
function legend() {
  const used = new Set(), walk = (n, d) => { if (d > 2) return; (n.children || []).forEach((c) => { used.add(catOf(c)); walk(c, d + 1); }); }; walk(D.tree, 0);
  $("#legend").innerHTML = Object.entries(CATS).filter(([k]) => used.has(k)).map(([k, l]) => `<span><i style="background:var(--c-${k})"></i>${l}</span>`).join("")
    + `<span><i style="background:repeating-linear-gradient(-45deg,var(--ok) 0 2px,transparent 2px 4px)"></i>Safe</span><span><i style="background:repeating-linear-gradient(-45deg,var(--warn) 0 2px,transparent 2px 4px)"></i>Review</span>`;
}
async function loadDisk() {
  if (diskFor === dev && D) { requestAnimationFrame(drawMap); return; }
  try {
    const d = await get(dev, "/data.json?" + Date.now());
    diskFor = dev; D = d;
    D.home = (D.tree.children.find((c) => c.name === "Home") || {}).path || "";
    const saved = localStorage.getItem(selKey());
    sel.clear();
    if (saved) JSON.parse(saved).forEach((id) => sel.add(id)); else D.recs.filter((r) => r.group === "safe").forEach((r) => sel.add(r.id));
    const hi = D.tree.children.findIndex((c) => c.name === "Home");
    path = hi >= 0 ? [hi] : [];
    const when = new Date(d.scannedAt).toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
    $("#runhint").textContent = `Scanned ${when}. Paste into a terminal on ${devOf(dev).name}. Nothing is deleted from this page.`;
    legend(); drawRecs(); requestAnimationFrame(drawMap);
  } catch { toast("Couldn't load the disk scan"); }
}

// ---------------------------------------------------------------- start
async function boot() {
  let c = { name: location.hostname, peers: [] };
  try { c = await (await fetch("/api/config", { cache: "no-store" })).json(); } catch {}
  // ids are the names; this machine uses relative URLs so any hostname or proxy works
  DEVICES = [{ id: c.name, name: c.name, url: "" }].concat(c.peers.filter((p) => p.name !== c.name).map((p) => ({ id: p.name, name: p.name, url: p.url })));
  S = Object.fromEntries(DEVICES.map((d) => [d.id, { now: null, pts: [], day: [], info: null, ok: null }]));
  const saved = localStorage.getItem("mon.dev");
  dev = DEVICES.some((d) => d.id === saved) ? saved : DEVICES[0].id;
  DEVICES.forEach((d) => { poll(d.id); pollInfo(d.id); setInterval(() => pollInfo(d.id), 60000); });
  drawMachines();
  const want = location.hash.slice(1);
  if (want === "disk") { setView("live"); pollInfo(dev).then(() => setView("disk")); } // the Disk tab needs this machine's info first
  else setView(want === "specs" ? "specs" : "live");
}
boot();
</script>
