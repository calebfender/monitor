<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monitor</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  :root {
    --bg: #0d0f12; --panel: #13161b; --line: #22262d; --line2: #2d323b;
    --text: #e8e6e1; --dim: #8b8f97; --faint: #5a5f68;
    --safe: #6fbf8e; --review: #d9a35b;
    --c-media: #c9825b; --c-dev: #8a7fd6; --c-apps: #5d8fc4; --c-browser: #58a6a6;
    --c-ai: #c96f8f; --c-cache: #7f9c5e; --c-sys: #50555e;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { background: var(--bg); color: var(--text); font: 14px/1.4 -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif; -webkit-font-smoothing: antialiased; }
  body { padding: 28px 32px 32px; min-height: 100vh; }
  .num { font-family: var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }

  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 26px; }
  h1 { font-size: 15px; font-weight: 600; letter-spacing: 0.01em; }
  h1 span { color: var(--faint); font-weight: 400; margin-left: 10px; }
  .meta { color: var(--faint); font-size: 12px; }

  .stats { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); margin-bottom: 26px; }
  .stat { padding: 18px 0 20px; }
  .stat + .stat { padding-left: 24px; border-left: 1px solid var(--line); }
  .stat label { display: flex; align-items: center; gap: 7px; color: var(--dim); font-size: 12px; margin-bottom: 8px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; }
  .stat .v { font-size: 30px; font-weight: 500; }
  .stat .v small { font-size: 13px; color: var(--dim); margin-left: 8px; font-weight: 400; }
  .stat .v small.up { color: var(--safe); }
  .bar { height: 3px; background: var(--line); margin-top: 12px; position: relative; overflow: hidden; }
  .bar i { position: absolute; inset: 0 auto 0 0; transition: width .5s cubic-bezier(.2,.8,.2,1), left .5s cubic-bezier(.2,.8,.2,1); }

  main { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 28px; align-items: start; }
  .head { display: flex; align-items: center; justify-content: space-between; height: 32px; margin-bottom: 12px; }
  .crumbs { display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--dim); min-width: 0; overflow: hidden; white-space: nowrap; }
  .crumbs button { all: unset; cursor: pointer; color: var(--dim); }
  .crumbs button:hover { color: var(--text); }
  .crumbs b { color: var(--text); font-weight: 500; }
  .crumbs .sep { color: var(--faint); }
  .seg { display: flex; border: 1px solid var(--line2); border-radius: 7px; padding: 2px; flex: none; }
  .seg button { all: unset; cursor: pointer; padding: 4px 12px; font-size: 12px; color: var(--dim); border-radius: 5px; transition: background .15s, color .15s; }
  .seg button.on { background: var(--line2); color: var(--text); }

  #map { position: relative; height: calc(100vh - 330px); min-height: 460px; }
  .t { position: absolute; border-radius: 5px; overflow: hidden; cursor: pointer;
       transition: left .45s cubic-bezier(.2,.8,.2,1), top .45s cubic-bezier(.2,.8,.2,1), width .45s cubic-bezier(.2,.8,.2,1), height .45s cubic-bezier(.2,.8,.2,1), opacity .3s, filter .2s; }
  .t.lvl1 { border: 1px solid color-mix(in srgb, var(--c) 45%, transparent); background: color-mix(in srgb, var(--c) 12%, var(--bg)); }
  .t.lvl1:hover { border-color: color-mix(in srgb, var(--c) 80%, transparent); }
  .t.lvl2 { border: 1px solid color-mix(in srgb, var(--c) 30%, transparent); background: color-mix(in srgb, var(--c) 20%, var(--bg)); }
  .t.lvl2:hover { background: color-mix(in srgb, var(--c) 30%, var(--bg)); }
  .t.other { --c: var(--c-sys) !important; opacity: .7; }
  .t.hatch-safe, .t.hatch-review { --h: var(--safe); }
  .t.hatch-review { --h: var(--review); }
  .t.hatch-safe, .t.hatch-review { border-color: color-mix(in srgb, var(--h) 70%, transparent) !important;
       background-image: repeating-linear-gradient(-45deg, color-mix(in srgb, var(--h) 26%, transparent) 0 2px, transparent 2px 8px) !important;
       background-color: color-mix(in srgb, var(--h) 9%, var(--bg)) !important; }
  .t.sel { box-shadow: inset 0 0 0 1.5px var(--h); }
  #map.cleanup .t:not(.hatch-safe):not(.hatch-review):not(.has-hatch) { filter: saturate(0) brightness(.55); }
  .lab { position: absolute; left: 9px; top: 7px; right: 9px; font-size: 12px; display: flex; justify-content: space-between; gap: 8px; pointer-events: none; white-space: nowrap; }
  .lab span:first-child { overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
  .lab .num { color: var(--dim); font-size: 11px; flex: none; }
  .big { position: absolute; left: 9px; bottom: 7px; font-family: var(--mono); font-weight: 500; pointer-events: none; letter-spacing: -0.03em; }
  .legend { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 14px; color: var(--dim); font-size: 12px; }
  .legend span { display: flex; align-items: center; gap: 7px; }
  .legend i { width: 8px; height: 8px; border-radius: 2px; }

  aside { border-left: 1px solid var(--line); padding-left: 28px; position: sticky; top: 20px; }
  aside h2 { font-size: 15px; font-weight: 600; margin-bottom: 18px; height: 32px; display: flex; align-items: center; }
  .grp { display: flex; justify-content: space-between; align-items: center; margin: 4px 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
  .grp.safe { color: var(--safe); } .grp.review { color: var(--review); margin-top: 22px; }
  .grp .num { color: var(--dim); letter-spacing: -0.02em; font-size: 12px; text-transform: none; }
  .rec { border-top: 1px solid var(--line); }
  .row { display: grid; grid-template-columns: 20px 1fr auto 14px; gap: 12px; align-items: center; padding: 11px 0; cursor: pointer; }
  .row:hover .t1 { color: #fff; }
  .cb { width: 16px; height: 16px; border: 1.5px solid var(--line2); border-radius: 4px; display: grid; place-items: center; transition: background .15s, border-color .15s; }
  .rec.on .cb { background: var(--text); border-color: var(--text); }
  .cb svg { opacity: 0; transition: opacity .15s; } .rec.on .cb svg { opacity: 1; }
  .t1 { font-size: 13.5px; transition: color .15s; }
  .t2 { font-size: 11.5px; color: var(--faint); font-family: var(--mono); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .num { font-size: 13px; }
  .chev { color: var(--faint); transition: transform .25s; } .rec.open .chev { transform: rotate(90deg); }
  .more { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .3s cubic-bezier(.2,.8,.2,1); }
  .rec.open .more { grid-template-rows: 1fr; }
  .more > div { overflow: hidden; padding-left: 32px; }
  .more p { color: var(--dim); font-size: 12.5px; padding-bottom: 8px; }
  .more ul { list-style: none; padding: 0 0 8px; font-size: 12px; color: var(--dim); }
  .more li { display: flex; justify-content: space-between; padding: 2px 0; }
  .more pre { font-family: var(--mono); font-size: 11px; color: var(--dim); background: #0a0b0e; border: 1px solid var(--line); border-radius: 5px; padding: 8px 10px; margin-bottom: 12px; white-space: pre-wrap; word-break: break-all; }
  .foot { border-top: 1px solid var(--line); margin-top: 18px; padding-top: 16px; }
  .foot .sum { font-size: 12.5px; color: var(--dim); margin-bottom: 12px; }
  .foot .sum b { color: var(--text); font-weight: 500; }
  .btns { display: flex; gap: 8px; }
  .btn { all: unset; cursor: pointer; padding: 8px 14px; font-size: 13px; border-radius: 7px; border: 1px solid var(--line2); color: var(--text); transition: background .15s, transform .1s; }
  .btn:hover { background: var(--line); } .btn:active { transform: scale(.97); }
  .btn.pri { background: var(--text); color: var(--bg); border-color: var(--text); font-weight: 500; }
  .btn.pri:hover { background: #fff; }
  .hint { font-size: 11.5px; color: var(--faint); margin-top: 10px; }
  #tip { position: fixed; pointer-events: none; background: #1b1f25; border: 1px solid var(--line2); border-radius: 6px; padding: 7px 10px; font-size: 12px; opacity: 0; transition: opacity .12s; z-index: 10; max-width: 360px; }
  #tip .p { color: var(--faint); font-family: var(--mono); font-size: 11px; word-break: break-all; }
  #toast { position: fixed; bottom: 24px; left: 50%; transform: translate(-50%, 20px); background: var(--text); color: var(--bg); padding: 9px 16px; border-radius: 8px; font-size: 13px; opacity: 0; transition: all .3s cubic-bezier(.2,.8,.2,1); }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  [hidden] { display: none !important; }
  .hl { display: flex; align-items: center; gap: 22px; }
  .tabs { display: flex; gap: 2px; }
  .tabs button { all: unset; cursor: pointer; font-size: 13px; color: var(--faint); padding: 3px 10px; border-radius: 6px; transition: color .15s, background .15s; }
  .tabs button:hover { color: var(--dim); } .tabs button.on { color: var(--text); background: var(--line); }
  header { align-items: center; }
  :root { --m-app: #3987e5; --m-wired: #d95926; --m-comp: #199e70;
          --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b; }
  .verdict { display: flex; gap: 14px; align-items: flex-start; margin: -4px 0 24px; }
  .vdot { width: 9px; height: 9px; border-radius: 50%; margin-top: 10px; flex: none; background: var(--st, var(--faint)); box-shadow: 0 0 0 4px color-mix(in srgb, var(--st, transparent) 18%, transparent); transition: background .4s; }
  .vt { font-size: 24px; font-weight: 500; letter-spacing: -0.015em; }
  .vs { color: var(--dim); font-size: 13.5px; margin-top: 3px; min-height: 19px; }
  .bar.mem { display: flex; gap: 2px; } .bar.mem i { position: static; flex: none; }
  .prl { display: inline-flex; align-items: center; gap: 9px; font-size: 22px; }
  .prl i { width: 8px; height: 8px; border-radius: 50%; }
  .chart { position: relative; margin-bottom: 22px; }
  .ct { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; color: var(--dim); margin-bottom: 8px; }
  .ct .num { color: var(--text); font-size: 12px; }
  .ckey { display: flex; gap: 14px; } .ckey span { display: flex; align-items: center; gap: 6px; } .ckey i { width: 8px; height: 8px; border-radius: 2px; }
  .chart svg { display: block; width: 100%; height: 190px; overflow: visible; }
  #c-mem svg { height: 210px; }
  .chart .grid { stroke: var(--line); stroke-width: 1; }
  .chart .ax { fill: var(--faint); font: 10.5px var(--mono); }
  .chart .xh { stroke: var(--dim); stroke-width: 1; }
  .plist .pr { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 13px; }
  .plist .pn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .plist .pn small { color: var(--faint); font-family: var(--mono); font-size: 11px; margin-left: 6px; }
  .plist .pb { grid-column: 1 / -1; height: 2px; background: var(--line); position: relative; }
  .plist .pb i { position: absolute; inset: 0 auto 0 0; border-radius: 2px; transition: width .6s cubic-bezier(.2,.8,.2,1); }
  #tip .tr { display: flex; justify-content: space-between; gap: 16px; } #tip .tr span:last-child { font-family: var(--mono); }
  #tip .tk { display: inline-block; width: 7px; height: 7px; border-radius: 2px; margin-right: 6px; }
  .devs { display: flex; gap: 6px; }
  .dev { all: unset; cursor: pointer; display: flex; align-items: center; gap: 9px; padding: 6px 12px 6px 10px; border-radius: 8px; border: 1px solid transparent; transition: background .15s, border-color .15s; }
  .dev:hover { background: var(--panel); }
  .dev.on { border-color: var(--line2); background: var(--panel); }
  .dev i { width: 7px; height: 7px; border-radius: 50%; background: var(--st, var(--faint)); transition: background .4s; flex: none; }
  .dev b { font-size: 14px; font-weight: 600; }
  .dev span { font-size: 11.5px; color: var(--faint); }
  .dev:not(.on) b { color: var(--dim); font-weight: 500; }
  .specs { display: grid; grid-template-columns: 150px repeat(var(--n), minmax(0, 1fr)); border-top: 1px solid var(--line); }
  .specs > div { padding: 13px 16px 13px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; min-width: 0; }
  .specs .k { color: var(--dim); font-size: 12.5px; }
  .specs .h { font-weight: 600; font-size: 15px; padding: 16px 16px 14px 0; display: flex; align-items: center; gap: 9px; }
  .specs .h i { width: 7px; height: 7px; border-radius: 50%; background: var(--st, var(--faint)); }
  .specs small { color: var(--faint); font-size: 12px; margin-left: 6px; }
  .specs .dk + .dk { margin-top: 10px; }
  .specs .dk .bar { margin-top: 6px; }
  @media (max-width: 1000px) {
    body { padding: 20px 16px; }
    .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } .stat .v { font-size: 22px; } .stat .v small { display: block; margin: 4px 0 0; } .stat + .stat { padding-left: 16px; } .stat:nth-child(3) { border-left: 0; padding-left: 0; } .stat:nth-child(n+3) { border-top: 1px solid var(--line); }
    main { grid-template-columns: minmax(0, 1fr); } html, body { overflow-x: hidden; } aside { border-left: 0; padding-left: 0; position: static; }
    #map { height: 62vh; min-height: 380px; }
    header { flex-direction: column; align-items: flex-start; gap: 10px; } .hl { flex-wrap: wrap; gap: 10px; }
    .dev span { display: none; } .specs { grid-template-columns: 96px repeat(var(--n), minmax(0, 1fr)); font-size: 12.5px; }
  }
</style>
</head>
<body>
<header>
  <div class="hl"><nav class="devs" id="devs"></nav>
    <nav class="tabs"><button data-v="live" class="on">Live</button><button data-v="specs">Specs</button><button data-v="disk" id="t-disk" hidden>Disk</button></nav></div>
  <div class="meta" id="meta"></div>
</header>

<div id="v-live">
  <section class="verdict"><i class="vdot"></i><div><div class="vt" id="vt">&nbsp;</div><div class="vs" id="vs"></div></div></section>
  <section class="stats">
    <div class="stat"><label>CPU</label><div class="v num" id="l-cpu"></div><div class="bar"><i id="lb-cpu" style="background:var(--text)"></i></div></div>
    <div class="stat"><label>Memory</label><div class="v num" id="l-mem"></div><div class="bar mem"><i id="lb-a" style="background:var(--m-app)"></i><i id="lb-b" style="background:var(--m-wired)"></i><i id="lb-c" style="background:var(--m-comp)"></i></div></div>
    <div class="stat"><label>Swap</label><div class="v num" id="l-swap"></div></div>
    <div class="stat"><label>Pressure</label><div class="v" id="l-pr"></div></div>
  </section>
  <main>
    <section>
      <div class="head"><div class="crumbs"><b>History</b></div>
        <div class="seg" id="range"><button data-r="300000">5 min</button><button class="on" data-r="1800000">30 min</button><button data-r="day">24 h</button></div></div>
      <div class="chart" id="c-cpu"><div class="ct"><span>CPU</span></div><svg></svg></div>
      <div class="chart" id="c-mem"><div class="ct"><span>Memory</span><span class="ckey" id="ckey"></span></div><svg></svg></div>
    </section>
    <aside>
      <h2>Using CPU</h2><div class="plist" id="p-cpu"></div>
      <h2 style="margin-top:26px">Using memory</h2><div class="plist" id="p-mem"></div>
    </aside>
  </main>
</div>

<div id="v-specs" hidden><div class="specs" id="specs"></div></div>

<div id="v-disk" hidden>
<section class="stats">
  <div class="stat"><label>Free after cleanup</label><div class="v num" id="s-free"></div><div class="bar"><i id="b-free" style="background:var(--text)"></i><i id="b-gain" style="background:var(--safe)"></i></div></div>
  <div class="stat"><label><i class="dot" style="background:var(--safe)"></i>Safe to remove</label><div class="v num" id="s-safe"></div></div>
  <div class="stat"><label><i class="dot" style="background:var(--review)"></i>Needs review</label><div class="v num" id="s-review"></div></div>
  <div class="stat"><label>Disk</label><div class="v num" id="s-disk"></div></div>
</section>

<main>
  <section>
    <div class="head">
      <div class="crumbs" id="crumbs"></div>
      <div class="seg"><button class="on" data-m="category">Category</button><button data-m="cleanup">Cleanup</button></div>
    </div>
    <div id="map"></div>
    <div class="legend" id="legend"></div>
  </section>
  <aside>
    <h2>Recommendations</h2>
    <div id="recs"></div>
    <div class="foot">
      <div class="sum" id="selsum"></div>
      <div class="btns"><button class="btn" id="selsafe">Select safe</button><button class="btn pri" id="copy">Copy script</button><button class="btn" id="dl">Download</button></div>
      <div class="hint" id="runhint">Nothing is deleted from this page.</div>
    </div>
  </aside>
</main>
</div>
<div id="tip"></div><div id="toast"></div>

<script>
const CATS = {
  media:   ["Documents & media", "--c-media"],
  dev:     ["Code & dev tools", "--c-dev"],
  apps:    ["Apps", "--c-apps"],
  browser: ["Browsers", "--c-browser"],
  ai:      ["AI models", "--c-ai"],
  cache:   ["Caches & temp", "--c-cache"],
  sys:     ["System & other", "--c-sys"],
};
const RULES = [
  [/OptGuideOnDevice|superwhisper\/models|\.ollama|\.lmstudio|huggingface|\/models$/i, "ai"],
  [/\/Caches|\/\.cache|\/var\/cache|\/var\/log|\/\.npm|Temp files|\/var\/folders|\/Logs|CacheClip|\.Trash/i, "cache"],
  [/Google\/Chrome|Firefox|BraveSoftware|Safari|GoogleUpdater/i, "browser"],
  [/Pictures|Movies|Music|Documents|Desktop|Downloads|Messages|Photos|DaVinci Resolve Media|Google Drive|MobileSMS/i, "media"],
  [/\/\.[^/]+|Developer|\/go$|\/go\/|vendor|Homebrew|\/opt\/homebrew|\/Code$|Xcode/i, "dev"],
  [/Applications|Application Support|Containers|Group Containers/i, "apps"],
];
const catOf = (n) => {
  if (n.system) return "sys";
  for (const [re, c] of RULES) if (re.test(n.path)) return c;
  return /^\/(System|Library|usr|var|boot|etc|snap|lib)/.test(n.path) ? "sys" : "apps";
};

const gb = (b) => b >= 1e9 ? (b / 1e9).toFixed(b >= 1e11 ? 0 : 1) + " GB" : Math.round(b / 1e6) + " MB";
const $ = (s) => document.querySelector(s);
let D, path = [], mode = "category";
const sel = new Set(); // checked recommendations, saved per device

function squarify(items, x, y, w, h) {
  const out = [], total = items.reduce((s, i) => s + i.size, 0);
  if (!total || w <= 0 || h <= 0) return out;
  let rest = items.slice(), scale = (w * h) / total;
  while (rest.length) {
    const short = Math.min(w, h); let row = [], best = Infinity;
    for (const it of rest) {
      const r = row.concat(it), s = r.reduce((a, b) => a + b.size * scale, 0);
      const mx = Math.max(...r.map(i => i.size * scale)), mn = Math.min(...r.map(i => i.size * scale));
      const worst = Math.max((short * short * mx) / (s * s), (s * s) / (short * short * mn));
      if (worst > best) break; best = worst; row = r;
    }
    rest = rest.slice(row.length);
    const s = row.reduce((a, b) => a + b.size * scale, 0), thick = s / short;
    let off = 0;
    for (const it of row) {
      const len = (it.size * scale) / thick;
      out.push(w >= h ? { n: it, x, y: y + off, w: thick, h: len } : { n: it, x: x + off, y, w: len, h: thick });
      off += len;
    }
    if (w >= h) { x += thick; w -= thick; } else { y += thick; h -= thick; }
  }
  return out;
}

function recFor(p) {
  for (const r of D.recs) for (const m of r.match) if (p === m || p.startsWith(m + "/")) return r;
  return null;
}
function hasRecInside(p) { return D.recs.some(r => r.match.some(m => m.startsWith(p + "/"))); }

function node() { let n = D.tree; for (const i of path) n = n.children[i]; return n; }

function tileClass(n, lvl) {
  const r = recFor(n.path), c = ["t", "lvl" + lvl];
  if (n.other) c.push("other");
  if (r) { c.push("hatch-" + r.group); if (sel.has(r.id)) c.push("sel"); }
  else if (hasRecInside(n.path)) c.push("has-hatch");
  return c.join(" ");
}

function drawMap() {
  const map = $("#map"), W = map.clientWidth, H = map.clientHeight, cur = node();
  map.classList.toggle("cleanup", mode === "cleanup");
  const kids = (cur.children || []).filter(k => k.size > 0);
  const html = [];
  const GAP = 6;
  squarify(kids, 0, 0, W, H).forEach((r, i) => {
    const n = r.n, w = r.w - GAP, h = r.h - GAP, c = CATS[catOf(n)][1];
    const showLab = w > 60 && h > 24, showBig = w > 90 && h > 64 && !n.children;
    html.push(`<div class="${tileClass(n, 1)}" style="--c:var(${c});left:${r.x}px;top:${r.y}px;width:${w}px;height:${h}px" data-i="${i}" data-p="${encodeURIComponent(n.path)}">`);
    if (showLab) html.push(`<div class="lab"><span>${esc(n.name)}</span><span class="num">${gb(n.size)}</span></div>`);
    if (n.children && w > 50 && h > 50) {
      const top = showLab ? 30 : 6;
      squarify(n.children.filter(k => k.size > 0), 6, top, w - 6, h - top - 0).forEach(s => {
        const sw = s.w - 5, sh = s.h - 5;
        if (sw < 4 || sh < 4) return;
        const cc = CATS[catOf(s.n)][1];
        const fs = Math.max(12, Math.min(26, Math.sqrt(sw * sh) / 7));
        html.push(`<div class="${tileClass(s.n, 2)}" style="--c:var(${cc});left:${s.x}px;top:${s.y}px;width:${sw}px;height:${sh}px" data-sub="${encodeURIComponent(s.n.path)}">`
          + (sw > 70 && sh > 24 ? `<div class="lab"><span>${esc(s.n.name)}</span></div>` : "")
          + (sw > 70 && sh > 54 ? `<div class="big" style="font-size:${fs}px">${gb(s.n.size)}</div>` : "")
          + `</div>`);
      });
    } else if (showBig) {
      html.push(`<div class="big" style="font-size:${Math.max(14, Math.min(30, Math.sqrt(w * h) / 7))}px">${gb(n.size)}</div>`);
    }
    html.push(`</div>`);
  });
  map.innerHTML = html.join("");
  drawCrumbs();
}

function esc(s) { return s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]); }

function drawCrumbs() {
  let n = D.tree; const parts = [`<button data-d="0">${esc(D.tree.name)}</button>`];
  path.forEach((i, d) => { n = n.children[i]; parts.push(`<span class="sep">/</span>` + (d === path.length - 1 ? `<b>${esc(n.name)}</b>` : `<button data-d="${d + 1}">${esc(n.name)}</button>`)); });
  if (!path.length) parts[0] = `<b>${esc(D.tree.name)}</b>`;
  $("#crumbs").innerHTML = parts.join("") + `<span class="sep" style="margin-left:10px" class="num">${gb(node().size)}</span>`;
}

function findPath(p) {
  const walk = (n, acc) => {
    if (!n.children) return null;
    for (let i = 0; i < n.children.length; i++) {
      const c = n.children[i];
      if (c.path === p) return acc.concat(i);
      if (p.startsWith(c.path + "/")) { const r = walk(c, acc.concat(i)); if (r) return r; }
    }
    return null;
  };
  return walk(D.tree, []);
}

$("#map").addEventListener("click", (e) => {

  let target = sub ? findPath(decodeURIComponent(sub.dataset.sub)) : top ? path.concat(+top.dataset.i) : null;
  if (!target) return;
  // only drill into nodes that have children
  let n = D.tree; for (const i of target) n = n.children[i];
  if (!n.children && sub) target = target.slice(0, -1), n = null;
  if (n && !n.children) return;
  path = target; drawMap();
});

// ---------------- Live: CPU & memory, every device ----------------
// This machine plus every --peer it was started with (GET /api/config).
let DEVICES = [], S = {}, dev = null;
const MODELS = { "Mac16,10": "Mac mini (M4, 2024)", "Mac16,11": "Mac mini (M4 Pro, 2024)" }; // anything else shows its model id
let view = ["disk", "specs"].includes(location.hash.slice(1)) ? location.hash.slice(1) : "live", scannedText = "";
const GiB = 2 ** 30, MiB = 2 ** 20, gib = (b) => (b / GiB).toFixed(b >= 10 * GiB ? 0 : 1) + " GB";

const ST = { good: "Normal", warning: "Elevated", serious: "High", critical: "Critical" };
const PR = ["normal", "warn", "critical"];
const conv = (p) => ({ t: p[0], cpu: p[1], app: p[2] * MiB, wired: p[3] * MiB, comp: p[4] * MiB, swap: p[5] * MiB, pr: PR[p[6]], top: p[7] });

}

function verdict(x) {
  const n = x.now;
  if (x.ok === false || !n) return ["", x.ok === false ? "Can't reach it" : "Connecting…", x.ok === false ? "Its monitor isn't answering. The machine may be asleep or offline." : ""];
  const m = n.mem, recent = x.pts.filter(p => p.t > n.t - 30000);
  const cpu30 = recent.reduce((a, p) => a + p.cpu, 0) / Math.max(1, recent.length);
  const topM = n.topMem[0] || { name: "", mem: 0 }, topC = n.topCpu[0] || { name: "", cpu: 0 };
  const swapHeavy = m.swap > 0.4 * m.total;
  if (m.pressure === "critical") return ["critical", "Memory is full", `${topM.name} is using ${gib(topM.mem)}. Quit it to speed things up.`];
  if (m.pressure === "warn" || swapHeavy) return ["serious", "Memory is tight", `${topM.name} is using ${gib(topM.mem)}, and ${gib(m.swap)} has spilled onto the disk.`];
  if (cpu30 > 85) return ["serious", "CPU is maxed out", `${topC.name} is using ${pct(topC.cpu)} of the processor.`];
  if (cpu30 > 60) return ["warning", "Working hard", `${topC.name} is the busiest at ${pct(topC.cpu)}.`];
  return ["good", "Running smoothly", topC.cpu > 5 ? `Busiest right now: ${topC.name}` : ""];
}
const stOf = (pr) => ({ normal: "good", warn: "serious", critical: "critical" })[pr];

function drawDevs() {
  $("#devs").innerHTML = DEVICES.map(d => {
    const x = S[d.id], [st] = verdict(x), n = x.now;

    return `<button class="dev${d.id === dev ? " on" : ""}" data-d="${d.id}" style="${st ? `--st:var(--${st})` : ""}"><i></i><b>${esc(d.name)}</b><span class="num">${sub}</span></button>`;
  }).join("");
}
$("#devs").addEventListener("click", (e) => { const b = e.target.closest(".dev"); if (b && b.dataset.d !== dev) setDev(b.dataset.d); });

function drawNow() {

    <div class="pb"><i style="width:${Math.min(100, val(a) / max * 100)}%;background:${color}"></i></div></div>`).join("");

}

function series() {
  const x = cur();
  if (range === "day") return { pts: x.day, span: 864e5 };
  const end = x.now ? x.now.t : Date.now();
  return { pts: x.pts.filter(p => p.t > end - range), span: range };
}
const endT = () => range === "day" ? Date.now() : (cur().now ? cur().now.t : Date.now());

function chart(el, pts, t0, t1, ymax, lay, yfmt, ticks) {
  const svg = el.querySelector("svg"), W = svg.clientWidth, H = svg.clientHeight, PB = 18, PR = 34;
  const iw = W - PR, ih = H - PB;
  const X = (t) => (t - t0) / (t1 - t0) * iw, Y = (v) => ih - Math.min(v, ymax) / ymax * ih;
  const out = [];
  ticks.forEach(v => out.push(`<line class="grid" x1="0" x2="${iw}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax" x="${iw + 6}" y="${Y(v) + 3.5}">${yfmt(v)}</text>`));
  out.push(`<line class="grid" x1="0" x2="${iw}" y1="${ih}" y2="${ih}"/>`);
  // contiguous runs only: a restart or sleep leaves a gap rather than a straight line across it
  const runs = []; let run = [];
  const gap = range === "day" ? 180000 : 8000;
  pts.forEach((p, i) => { if (i && p.t - pts[i - 1].t > gap) { runs.push(run); run = []; } run.push(p); }); if (run.length) runs.push(run);
  for (const r of runs) {
    if (r.length < 2) continue;
    let base = r.map(() => 0);
    for (const [key, color, op] of lay) {
      const top = r.map((p, i) => base[i] + key(p));
      const line = r.map((p, i) => `${X(p.t).toFixed(1)},${Y(top[i]).toFixed(1)}`);
      const back = r.map((p, i) => `${X(p.t).toFixed(1)},${Y(base[i]).toFixed(1)}`).reverse();
      out.push(`<polygon points="${line.concat(back).join(" ")}" fill="${color}" fill-opacity="${op}"/>`);
      out.push(`<polyline points="${line.join(" ")}" fill="none" stroke="${lay.length > 1 ? "var(--bg)" : color}" stroke-width="${lay.length > 1 ? 1.5 : 2}" stroke-linejoin="round"/>`);
      base = top;
    }
  }
  const lbl = (t) => new Date(t).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  const nx = W < 500 ? 3 : 5;
  for (let i = 0; i < nx; i++) { const t = t0 + (t1 - t0) * i / (nx - 1); out.push(`<text class="ax" x="${X(t)}" y="${H - 3}" text-anchor="${i === 0 ? "start" : i === nx - 1 ? "end" : "middle"}">${i === nx - 1 ? "now" : lbl(t)}</text>`); }
  if (hoverT) { const hx = X(hoverT); if (hx >= 0 && hx <= iw) out.push(`<line class="xh" x1="${hx}" x2="${hx}" y1="0" y2="${ih}"/>`); }
  svg.innerHTML = out.join("");
}

function drawCharts() {
  const { pts, span } = series(), t1 = endT(), t0 = t1 - span, tot = cur().now?.mem.total || cur().info?.ram || 16 * GiB;
  chart($("#c-cpu"), pts, t0, t1, 100, [[p => p.cpu, "var(--text)", 0.08]], v => v + "%", [50, 100]);
  chart($("#c-mem"), pts, t0, t1, tot, [[p => p.app, "var(--m-app)", 0.85], [p => p.wired, "var(--m-wired)", 0.85], [p => p.comp, "var(--m-comp)", 0.85]],
    v => Math.round(v / GiB) + "G", [tot / 2, tot]);
}
function drawLive() { drawDevs(); if (view === "live") { drawNow(); drawCharts(); } else if (view === "specs") drawSpecs(); }

function hover(e) {
  const svg = e.currentTarget.querySelector("svg"), r = svg.getBoundingClientRect(), iw = r.width - 34;
  const { pts, span } = series(), t1 = endT(), t0 = t1 - span, x = e.clientX - r.left;
  if (x < 0 || x > iw || !pts.length) return unhover();
  const t = t0 + x / iw * span;
  let best = pts[0]; for (const p of pts) if (Math.abs(p.t - t) < Math.abs(best.t - t)) best = p;
  if (Math.abs(best.t - t) > (range === "day" ? 180000 : 8000)) return unhover();
  hoverT = best.t; drawCharts();
  const k = (c) => `<i class="tk" style="background:var(${c})"></i>`, L = layers();
  tip.innerHTML = `<div class="p" style="margin-bottom:5px">${new Date(best.t).toLocaleTimeString([], { hour: "numeric", minute: "2-digit", second: range === "day" ? undefined : "2-digit" })}</div>`
    + `<div class="tr"><span>CPU</span><span>${pct(best.cpu)}</span></div>`
    + `<div class="tr"><span>${k("--m-app")}${L[0]}</span><span>${gib(best.app)}</span></div>`
    + `<div class="tr"><span>${k("--m-wired")}${L[1]}</span><span>${gib(best.wired)}</span></div>`
    + `<div class="tr"><span>${k("--m-comp")}${L[2]}</span><span>${gib(best.comp)}</span></div>`
    + `<div class="tr"><span>Swap</span><span>${gib(best.swap)}</span></div>`
    + (best.top.length ? `<div class="p" style="margin:6px 0 3px">Busiest</div>` + best.top.map(([nm, v]) => `<div class="tr"><span>${esc(nm)}</span><span>${pct(v)}</span></div>`).join("") : "");
  tip.style.opacity = 1;
  tip.style.left = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 10) + "px";
  tip.style.top = Math.min(e.clientY + 14, innerHeight - tip.offsetHeight - 10) + "px";
}
function unhover() { if (hoverT !== null) { hoverT = null; drawCharts(); } tip.style.opacity = 0; }
document.querySelectorAll(".chart").forEach(c => { c.addEventListener("mousemove", hover); c.addEventListener("mouseleave", unhover); });

document.querySelectorAll("#range button").forEach(b => b.onclick = () => {
  document.querySelectorAll("#range button").forEach(x => x.classList.toggle("on", x === b));
  range = b.dataset.r === "day" ? "day" : +b.dataset.r; if (range === "day") pollDay(); drawCharts();

// ---- Specs: every device side by side
const dur = (s) => { const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600); return d ? `${d} day${d > 1 ? "s" : ""}, ${h} h` : `${h} h ${Math.floor(s % 3600 / 60)} min`; };
const mbs = (b) => b < MiB ? Math.round(b / 1024) + " KB" : (b / MiB).toFixed(1) + " MB";
function drawSpecs() {
  if (view !== "specs") return;
  const cols = DEVICES.map(d => [d, S[d.id]]);
  const rows = [
    ["Model", (i) => MODELS[i.model] || i.model],
    ["Chip", (i) => esc(i.chip)],
    ["Cores", (i) => i.perf ? `${i.cores}<small>${i.perf} performance · ${i.eff} efficiency</small>` : i.cores],
    ["Memory", (i) => gib(i.ram)],
    ["Software", (i) => esc(i.os)],
    ["Up for", (i) => dur(Date.now() / 1000 - i.boot)],
    ["Now", (i, x) => x.now ? `${pct(x.now.cpu)} CPU<small>${gib(x.now.mem.used)} of ${gib(x.now.mem.total)} memory</small>` : "–"],
    ["Storage", (i) => i.disks.map(k => `<div class="dk">${esc(k.name)}<small>${gib(k.free)} free of ${gib(k.total)}</small><div class="bar"><i style="width:${(1 - k.free / k.total) * 100}%;background:var(--text)"></i></div></div>`).join("")],
    ["This monitor", (i, x) => `${mbs(x.now?.own || i.own)}<small>of memory</small>`],
  ];
  const h = [`<div class="h"></div>`].concat(cols.map(([d, x]) => { const [st] = verdict(x); return `<div class="h" style="${st ? `--st:var(--${st})` : ""}"><i></i>${esc(d.name)}</div>`; }));
  for (const [k, f] of rows) {
    h.push(`<div class="k">${k}</div>`);
    for (const [, x] of cols) h.push(`<div>${x.info ? f(x.info, x) : x.ok === false ? `<span style="color:var(--faint)">offline</span>` : "–"}</div>`);
  }
  const el = $("#specs"); el.style.setProperty("--n", cols.length); el.innerHTML = h.join("");
}

// ---- Polling
async function get(d, path) {
  const r = await fetch(devOf(d).url + path, { cache: "no-store" });
  if (!r.ok) throw new Error(r.status);
  return r.json();
}
async function poll(id) {
  const x = S[id];
  if (!document.hidden) try {
    const since = x.pts.length ? x.pts[x.pts.length - 1].t : 0;
    const d = await get(id, "/api/live?since=" + since);
    if (d.now) x.now = d.now;
    x.pts.push(...d.points.map(conv)); x.ok = true;
    const cut = (x.now?.t || Date.now()) - 1800000 - 10000; while (x.pts.length && x.pts[0].t < cut) x.pts.shift();
  } catch { x.ok = false; }
  if (id === dev || view === "specs") drawLive(); else drawDevs();
  setTimeout(() => poll(id), id === dev ? 2000 : 5000);
}
async function pollInfo(id) {
  try { S[id].info = await get(id, "/api/info"); if (id === dev) $("#t-disk").hidden = !S[id].info.diskMap; drawLive(); } catch {}
}
async function pollDay() { const id = dev; try { S[id].day = (await get(id, "/api/day")).points.map(conv); if (range === "day" && id === dev) drawCharts(); } catch {} }
setInterval(() => { if (range === "day") pollDay(); }, 60000);
addEventListener("resize", () => { if (view === "live") drawCharts(); });

// ---- Disk map (only devices that have a scan)
let diskFor = null;
async function loadDisk() {
  if (diskFor === dev && D) { drawMap(); return; }
  try {
    const d = await get(dev, "/data.json?" + Date.now());
    diskFor = dev; D = d;
    D.home = (D.tree.children.find(c => c.name === "Home") || {}).path || "";
    const saved = localStorage.getItem(selKey());
    sel.clear();
    if (saved) JSON.parse(saved).forEach(id => sel.add(id)); else D.recs.filter(r => r.group === "safe").forEach(r => sel.add(r.id));
    const t = new Date(d.scannedAt);
    scannedText = "Scanned " + t.toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
    if (view === "disk") $("#meta").textContent = scannedText;
    const hi = D.tree.children.findIndex(c => c.name === "Home");
    path = hi >= 0 ? [hi] : [];
    $("#runhint").textContent = `Paste into a terminal on ${hostOf(dev)}. Nothing is deleted from this page.`;
    legend(); drawRecs(); drawMap();
  } catch { toast("Couldn't load the disk scan"); }
}
let rt; addEventListener("resize", () => { if (view === "disk" && D) { clearTimeout(rt); rt = setTimeout(drawMap, 80); } });
async function boot() {
  let c = { name: location.hostname, peers: [] };
  try { c = await (await fetch("/api/config", { cache: "no-store" })).json(); } catch {}
  // ids are the names; the page's own machine uses relative URLs so any hostname or proxy works
  DEVICES = [{ id: c.name, name: c.name, url: "" }].concat(c.peers.filter(p => p.name !== c.name).map(p => ({ id: p.name, name: p.name, url: p.url })));
  S = Object.fromEntries(DEVICES.map(d => [d.id, { now: null, pts: [], day: [], info: null, ok: null }]));
  const saved = localStorage.getItem("mon.dev");
  dev = DEVICES.some(d => d.id === saved) ? saved : DEVICES[0].id;
  DEVICES.forEach(d => { poll(d.id); pollInfo(d.id); setInterval(() => pollInfo(d.id), 60000); });
  drawDevs();
  const wantDisk = view === "disk";
  setView(wantDisk ? "live" : view);
  if (wantDisk) pollInfo(dev).then(() => setView("disk")); // the Disk tab needs this device's info first
}
boot();
</script>
